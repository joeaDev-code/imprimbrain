services:
  postgres:
    image: postgres:17-alpine
    container_name: imprimbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: imprimbrain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - imprimbrain_pg:/var/lib/postgresql/data
volumes:
  imprimbrain_pg:
